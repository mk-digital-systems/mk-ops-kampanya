<title>MK OPS — GÖRÜNMEYEN YÜK · Marka Filmi (9:16 · 45 sn)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Inter","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.rec{cursor:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#04070f}
#stage>*{position:absolute;left:0;top:0}
canvas#fx{width:1080px;height:1920px}
.layer{width:1080px;height:1920px;visibility:hidden;pointer-events:none}
#vig{width:1080px;height:1920px;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}
#grain{width:1080px;height:1920px;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-size:256px 256px}
#fade{width:1080px;height:1920px;background:#000;opacity:0;pointer-events:none}

/* yazı motoru */
.txt{position:absolute;left:0;width:1080px;text-align:center;pointer-events:none}
.ln{white-space:nowrap;font-weight:900;color:#f2f7ff;letter-spacing:-.012em;line-height:1.02;font-family:"Inter","Segoe UI Black","Segoe UI Variable Display","Segoe UI",Arial,sans-serif}
.ln .in{display:inline-block}
.ch{display:inline-block;transform-origin:50% 88%;will-change:transform,opacity;text-shadow:0 8px 34px rgba(0,0,0,.55)}
.sp{width:.27em}
.k1{color:#19e3d0;text-shadow:0 0 38px rgba(25,227,208,.5),0 8px 30px rgba(0,0,0,.5)}
.k2{color:#ff6b4a}
.k3{color:#4aa3ff;text-shadow:0 0 36px rgba(31,139,255,.55),0 8px 30px rgba(0,0,0,.5)}

/* küçük sinema yazıları */
.cin{position:absolute;color:#e8eef7;font-weight:500;letter-spacing:.14em;white-space:nowrap;opacity:0;text-shadow:0 2px 20px rgba(0,0,0,.7)}
#clockTx{left:90px;top:1590px;font-size:34px}
#filmTitle{left:0;width:1080px;text-align:center;top:300px;font-size:44px;font-weight:300;letter-spacing:.55em;padding-left:.55em}

/* telefon (dünya içinde) */
.phone{position:absolute;left:0;top:0;width:360px;height:740px;border-radius:58px;background:#0a0c11;border:3px solid #2c3342;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.05) inset;transform-origin:0 0;will-change:transform;display:none}
.phone .scr{position:absolute;left:12px;top:12px;right:12px;bottom:12px;border-radius:46px;background:linear-gradient(165deg,#141b27,#090c13);overflow:hidden}
.phone .pt{position:absolute;left:0;top:70px;width:100%;text-align:center;font-size:84px;font-weight:300;color:#eef2f8;letter-spacing:-.02em}
.phone .pd{position:absolute;left:0;top:46px;width:100%;text-align:center;font-size:17px;font-weight:600;color:#b9c3d3}
.phone .pn{position:absolute;left:14px;width:300px;padding:11px 13px;border-radius:22px;background:rgba(56,62,76,.9);border:1px solid rgba(255,255,255,.1);display:flex;gap:11px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.45);will-change:transform,opacity}
.phone .pn .ic{flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(160deg,#3fdc74,#12a34a);position:relative}
.phone .pn .ic:after{content:"";position:absolute;left:9px;top:11px;width:22px;height:17px;border-radius:7px;background:#fff}
.phone .pn>div:last-child{min-width:0}.phone .pn b{display:block;font-size:14px;color:#f4f6fa;font-weight:800}
.phone .pn span{display:block;font-size:17px;color:#e9edf5;font-weight:600;line-height:1.16;margin-top:2px}
.phone .bdg{position:absolute;left:0;bottom:40px;width:100%;text-align:center;font-size:16px;font-weight:700;color:#ff9a8f;letter-spacing:.06em}

/* S3 kesmeleri */
#shots{filter:saturate(.62) contrast(1.08)}
.shot{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;overflow:hidden;background:#0a0e15}
.sheet{position:absolute;width:640px;height:860px;background:#d9dde3;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.6);background-image:linear-gradient(rgba(60,70,90,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(60,70,90,.2) 2px,transparent 2px);background-size:100% 44px,160px 100%}
.sheet em{position:absolute;font-family:"Segoe Print","Comic Sans MS",cursive;font-style:normal;color:#b5201c;font-size:54px;font-weight:700}
.call{position:absolute;left:150px;top:300px;width:780px;height:1320px;border-radius:84px;background:linear-gradient(170deg,#1a2230,#0b0f17);border:4px solid #2c3342;box-shadow:0 40px 120px rgba(0,0,0,.7)}
.call .nm{position:absolute;top:360px;left:0;width:100%;text-align:center;font-size:62px;font-weight:700;color:#f3f6fb}
.call .sb{position:absolute;top:450px;left:0;width:100%;text-align:center;font-size:36px;color:#a5afc0;font-weight:500}
.call .av{position:absolute;left:290px;top:130px;width:200px;height:200px;border-radius:50%;background:linear-gradient(160deg,#556073,#2a3140);display:flex;align-items:center;justify-content:center;font-size:90px;color:#dfe6f1;font-weight:700}
.call .ans{position:absolute;bottom:130px;left:300px;width:180px;height:180px;border-radius:50%;background:#2fcf5e;display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff}
.call .rej{position:absolute;bottom:130px;left:70px;width:180px;height:180px;border-radius:50%;background:#e5443a;display:none}
.tbl{position:absolute;left:70px;top:0;width:940px;font-family:"Consolas","Cascadia Mono","Segoe UI",monospace;font-size:40px;color:#cfd8e6}
.tbl div{display:flex;height:96px;align-items:center;border-bottom:2px solid rgba(255,255,255,.12)}
.tbl div span{flex:1}.tbl div span:nth-child(1){flex:0 0 340px}.tbl div span:nth-child(2){flex:0 0 240px}
.tbl .q{color:#ff6b4a;font-weight:700}
.win{position:absolute;background:#f4f6fa;border-radius:20px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.25);will-change:transform}
.win img{display:block;width:100%}
.win .bar{height:34px;background:#e9edf3}
#cur{position:absolute;width:0;height:0;border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;transform-origin:0 0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));display:none}

/* S4 / S6 */
#mods{filter:none}
.pnl{position:absolute;top:560px;width:900px;height:700px;border-radius:28px;overflow:hidden;background:#f1f4f9;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 100px rgba(31,139,255,.3),0 0 0 2px rgba(255,255,255,.28);will-change:transform,filter}
.pnl img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
#chip{position:absolute;left:0;top:1340px;width:1080px;text-align:center;font-size:40px;font-weight:800;letter-spacing:.3em;padding-left:.3em;color:#19e3d0;opacity:0;text-shadow:0 0 30px rgba(25,227,208,.6)}
#tile{position:absolute;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:22%;overflow:hidden;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 90px rgba(31,139,255,.65),0 30px 80px rgba(0,0,0,.5);opacity:0;will-change:transform,opacity}
#tile img{width:106%;height:106%;margin:-3%;display:block}
#cta{position:absolute;left:100px;top:1330px;width:880px;height:120px;border-radius:60px;background:linear-gradient(100deg,#0b6bd6,#1f8bff 55%,#19e3d0);color:#fff;font-size:48px;font-weight:900;letter-spacing:.01em;display:none;align-items:center;justify-content:center;gap:20px;box-shadow:0 20px 80px rgba(31,139,255,.6),0 0 0 2px rgba(255,255,255,.25) inset;overflow:hidden;white-space:nowrap}
#cta em{font-style:normal;font-size:52px}

/* kontroller */
#ui{position:fixed;left:0;bottom:0;width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:10px 12px;background:#05080f;border-top:1px solid rgba(90,170,255,.25);z-index:10}
#ui button,#ui label{all:unset;cursor:pointer;color:#e8f1ff;font:700 13px/1 "Segoe UI",Arial,sans-serif;padding:9px 12px;border-radius:10px;background:rgba(90,170,255,.16);white-space:nowrap}
#ui button:hover,#ui label:hover{background:rgba(90,170,255,.34)}
#ui button.on,#ui label.on{background:rgba(25,227,208,.35)}
#ui input[type=range]{width:min(46vw,380px);accent-color:#19e3d0}
#ui span.tm{color:#9fc4ff;font:700 13px "Segoe UI",Arial,sans-serif;min-width:96px;text-align:center}
#scn{position:relative;width:100%;height:26px;display:flex;gap:2px}
#scn i{flex:none;height:26px;border-radius:5px;background:rgba(90,170,255,.2);color:#cfe3ff;font:600 10px/26px "Segoe UI",Arial,sans-serif;text-align:center;overflow:hidden;white-space:nowrap;cursor:pointer;font-style:normal}
#scn i.cur{background:rgba(25,227,208,.45)}
body.hideui #ui,body.hideui #hint{display:none}
@media (max-width:700px){#hint{display:none}#ui{gap:6px;padding:6px 8px;flex-wrap:nowrap}#ui button{font-size:13px;padding:9px 10px}#ui #seek,#ui #tm,#ui #scn,#ui #bHide,#ui #bCap,#ui #bTts{display:none}}
#hint{position:fixed;left:0;top:0;width:100%;padding:8px 12px;text-align:center;background:#05080f;border-bottom:1px solid rgba(90,170,255,.2);color:#7fa3d6;font:600 12px "Segoe UI",Arial,sans-serif;z-index:10}
#st{position:fixed;left:0;top:0;white-space:pre;color:#8f8;font:12px monospace;z-index:20}
</style>

<div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="world" class="layer"><div class="phone" id="phone"><div class="scr"><div class="pd">Salı</div><div class="pt">06:52</div><div id="pns"></div><div class="bdg" id="pbd"></div></div></div></div>

<script>
"use strict";

const W=1080,H=1920,DUR=45;
const FONT='"Inter","Segoe UI Variable Display","Segoe UI",Arial,sans-serif';
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;
const eOut=u=>1-Math.pow(1-u,3), eIn=u=>u*u*u;
const eIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eExp=u=>u>=1?1:1-Math.pow(2,-10*u);
const sm=u=>u*u*(3-2*u);
const spring=p=>p<=0?0:1-Math.exp(-6.5*p)*Math.cos(15*p);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20251);
const mixc=(a,b,u)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],u))).join(',')})`;

/* ---------------- kinetik yazı motoru ---------------- */
function buildText(host,spec){
  const el=document.createElement('div');el.className='txt'+(spec.cls?' '+spec.cls:'');
  el.style.top=(spec.top||0)+'px';host.appendChild(el);
  const chars=[];let k=0;const ins=[];
  spec.lines.forEach((ln,li)=>{
    const d=document.createElement('div');d.className='ln';d.style.fontSize='100px';
    const inn=document.createElement('span');inn.className='in';d.appendChild(inn);el.appendChild(d);ins.push(inn);
    ln.segs.forEach(([txt,cls])=>{for(const ch of txt){
      const s=document.createElement('span');s.className='ch'+(cls?' '+cls:'');
      if(ch===' '){s.className+=' sp'}else{s.textContent=ch}
      inn.appendChild(s);chars.push({el:s,li,k:k++,sp:ch===' ',r:R(),c:''});
    }});
  });
  spec.lines.forEach((ln,li)=>{
    const d=el.children[li];const w=ins[li].offsetWidth||1;
    const fs=Math.min(ln.max||200,100*(spec.maxW||940)/w);
    d.style.fontSize=fs.toFixed(1)+'px';ln._fs=fs;ln._w=w*fs/100;
    if(ln.lh)d.style.lineHeight=ln.lh;
  });
  return {el,chars,spec,n:k,ins};
}
function runText(tx,t,t0,o){
  o=o||{};const st=o.st==null?.04:o.st,ex=o.ex,exSt=o.exSt==null?.01:o.exSt,exMode=o.exMode||'fall';
  const endT=ex==null?1e9:ex+tx.n*exSt+.9;
  if(t<t0||t>endT){tx.el.style.display='none';return false}
  tx.el.style.display='block';
  for(const c of tx.chars){
    if(c.sp)continue;
    const ln=tx.spec.lines[c.li];const mode=ln.mode||'drop';
    const p=t-(t0+c.k*st);
    let y=0,sx=1,sy=1,rot=0,op=0,bl=0,sc=1;
    if(p>0){
      op=1;
      if(mode==='drop'){
        const fd=.34+c.r*.1;
        if(p<fd){const u=p/fd;y=-(1-u*u)*(1500+c.r*300);sy=1.28;sx=.84;rot=(c.r-.5)*10*(1-u);bl=(1-u)*3}
        else{const q=p-fd;const e=Math.exp(-8*q)*Math.cos(22*q);sy=1-.4*e;sx=1+.24*e;y=-Math.abs(Math.sin(q*13))*Math.exp(-6*q)*34}
      }else if(mode==='grow'){
        sc=spring(p);op=clamp(p*9);bl=(1-clamp(p*5))*10;
      }else if(mode==='shrink'){
        sc=1+2.6*Math.exp(-8.5*p)*Math.cos(8*p);op=clamp(p*12);bl=13*Math.exp(-13*p);
      }else{ y=(1-eOut(clamp(p/.5)))*70;op=clamp(p*4);bl=(1-clamp(p*3))*8 }
    }
    if(ex!=null){
      const q=t-(ex+c.k*exSt);
      if(q>0){
        if(exMode==='fall'){y+=q*q*2900;sy*=1+q*1.1;rot+=(c.r-.5)*34*q;op*=1-clamp(q/.4)}
        else{const u=clamp(q/.42);sc*=1-eIn(u);op*=1-u}
      }
    }
    const s=`translate3d(0,${y.toFixed(1)}px,0) rotate(${rot.toFixed(1)}deg) scale(${(sx*sc).toFixed(3)},${(sy*sc).toFixed(3)})`;
    const key=s+'|'+op.toFixed(2)+'|'+(bl>.4?bl.toFixed(1):0);
    if(c.c!==key){c.c=key;const e=c.el.style;e.transform=s;e.opacity=op.toFixed(3);e.filter=bl>.4?`blur(${bl.toFixed(1)}px)`:'none'}
  }
  return true;
}
const L=(text,cls)=>[[text,cls||'']];


/* =====================================================================
   ÇİZİM KATMANI — stilize silüet sinematografisi (canlı çekim DEĞİLDİR)
   ===================================================================== */
const TAU=Math.PI*2;
function lg(g,x0,y0,x1,y1,st){const q=g.createLinearGradient(x0,y0,x1,y1);for(const [o,c] of st)q.addColorStop(o,c);return q}
function rgd(g,x,y,r0,r1,st){const q=g.createRadialGradient(x,y,r0,x,y,r1);for(const [o,c] of st)q.addColorStop(o,c);return q}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const mixA=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u);
const rgb=(a,al)=>al==null?`rgb(${a.map(Math.round).join(',')})`:`rgba(${a.map(Math.round).join(',')},${al})`;

/* kule vinç: kafes gövde, yük kolu, karşı ağırlık, ışık */
function crane(g,x,by,h,jl,col,t,blink){
  const w=26,top=by-h;
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;g.lineJoin='round';
  g.beginPath();g.moveTo(x-w/2,by);g.lineTo(x-w/2,top);g.moveTo(x+w/2,by);g.lineTo(x+w/2,top);
  for(let y=0;y<h;y+=30){g.moveTo(x-w/2,by-y);g.lineTo(x+w/2,by-y-30);g.moveTo(x+w/2,by-y);g.lineTo(x-w/2,by-y-30)}
  g.stroke();
  const sw=Math.sin(t*.22+x*.01)*5;
  g.beginPath();g.moveTo(x-jl*.3,top-6);g.lineTo(x+jl,top+sw*.1);g.moveTo(x-jl*.3,top+12);g.lineTo(x+jl,top+sw*.1);
  for(let k=0;k<=24;k++){const px=x-jl*.3+(jl*1.3)*k/24;const ty=top-6+(sw*.1+6)*k/24;g.moveTo(px,ty);g.lineTo(px+jl*.027,top+12+(sw*.1-12)*(k+1)/24*0)}
  g.stroke();
  g.beginPath();g.moveTo(x,top-72);g.lineTo(x+jl*.95,top-2);g.moveTo(x,top-72);g.lineTo(x-jl*.3,top-6);g.moveTo(x,top-72);g.lineTo(x,top);g.stroke();
  g.fillRect(x-jl*.3-8,top+4,34,40);
  const tx=x+jl*.58+Math.sin(t*.18+x)*jl*.06;
  g.fillRect(tx-6,top+8,12,10);g.lineWidth=2;g.beginPath();g.moveTo(tx,top+18);g.lineTo(tx,top+110+sw*3);g.stroke();
  g.fillRect(tx-7,top+110+sw*3,14,16);
  if(blink){const a=.25+.75*(Math.sin(t*3+x)>.6?1:0);g.fillStyle=`rgba(255,70,50,${a})`;g.beginPath();g.arc(x,top-76,5,0,TAU);g.fill();g.fillStyle=`rgba(255,70,50,${a*.25})`;g.beginPath();g.arc(x,top-76,22,0,TAU);g.fill()}
}
/* betonarme iskelet bina */
function frameBuilding(g,x,by,w,floors,fh,col,scaf){
  g.fillStyle=col;g.strokeStyle=col;
  const cols=Math.max(3,Math.round(w/90)),cw=w/(cols-1);
  for(let f=0;f<floors;f++){
    const y=by-(f+1)*fh;g.fillRect(x,y,w,12);
    for(let c=0;c<cols;c++)g.fillRect(x+c*cw-6,y,12,fh);
  }
  g.fillRect(x-4,by-floors*fh-4,w+8,10);
  for(let c=0;c<cols;c+=2)g.fillRect(x+c*cw-3,by-floors*fh-70,6,70);
  if(scaf){g.lineWidth=2;g.globalAlpha=.55;g.beginPath();for(let f=0;f<floors*2;f++){const y=by-f*fh/2;g.moveTo(x-18,y);g.lineTo(x+w+18,y)}
    for(let c=0;c<=w+36;c+=36){g.moveTo(x-18+c,by);g.lineTo(x-18+c,by-floors*fh)}g.stroke();g.globalAlpha=1}
}
/* ekskavatör */
function excavator(g,x,y,s,t,col){
  g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.strokeStyle=col;
  rrect(g,-125,-38,250,46,23);g.fill();
  g.beginPath();g.moveTo(-95,-36);g.lineTo(-95,-96);g.lineTo(-52,-128);g.lineTo(34,-128);g.lineTo(34,-36);g.closePath();g.fill();
  g.fillRect(-120,-52,90,18);
  const a1=-.8+Math.sin(t*.4)*.07,a2=.95+Math.sin(t*.4+1)*.12,a3=1.0+Math.sin(t*.4+2)*.15;
  g.translate(28,-96);g.rotate(a1);g.lineCap='round';g.lineWidth=17;g.beginPath();g.moveTo(0,0);g.lineTo(175,0);g.stroke();

/* ---------- kamera yardımcıları ---------- */
function kf(t,a){ // Catmull-Rom ile pürüzsüz kamera yolu: [[t,x,y,s],...]
  const n=a.length;if(t<=a[0][0])return{x:a[0][1],y:a[0][2],s:a[0][3]};if(t>=a[n-1][0])return{x:a[n-1][1],y:a[n-1][2],s:a[n-1][3]};
  let i=1;while(t>a[i][0])i++;
  const p0=a[Math.max(0,i-2)],p1=a[i-1],p2=a[i],p3=a[Math.min(n-1,i+1)],u=(t-p1[0])/(p2[0]-p1[0]),u2=u*u,u3=u2*u;
  const f=k=>.5*((2*p1[k])+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3);
  return{x:f(1),y:f(2),s:f(3)};
}
const camG=c=>{g.translate(540,960);g.scale(c.s,c.s);g.translate(-c.x,-c.y)};
const w2s=(c,x,y)=>[540+(x-c.x)*c.s,960+(y-c.y)*c.s];
const lay=(el,show,op)=>{el.style.visibility=show?'visible':'hidden';if(show&&op!=null)el.style.opacity=op.toFixed(3)};
const shakeAt=(t,list,amp,dur)=>{let s=0;for(const ts of list){const q=t-ts;if(q>0&&q<dur)s+=Math.exp(-9*q)*Math.sin(70*q)*amp*(ts*7%2<1?1:-1)}return s};

  let tOp=0,tSc=hs.ts,bl=0;
  if(t>=24.05&&t<30.2){const tp=t-24.05;tOp=clamp(tp*1.6)*(1-prog(t,29.9,30.2));tSc=hs.ts*lerp(1.25,1,eOut(prog(tp,0,1.4)));bl=(1-clamp(tp/1.4))*16}
  else if(t>=39){const tp=t-39.1;tOp=clamp(tp*2.2);tSc=hs.ts*lerp(1.15,1,eOut(prog(tp,0,.9)));bl=(1-clamp(tp/.8))*10}
  tile.style.opacity=tOp.toFixed(2);tile.style.filter=bl>.4?`blur(${bl.toFixed(1)}px)`:'none';
  tile.style.transform=`translate(${hs.tx.toFixed(1)}px,${hs.ty.toFixed(1)}px) scale(${tSc.toFixed(4)})`;
  runText(WM,t<39?t:t-14.7,24.9,{st:.07,ex:t<39?29.95:null,exSt:.002,exMode:'shrink'});
  WM.el.style.transform=`translate(${(hs.wx-540).toFixed(1)}px,${(hs.wy-WMF*.5).toFixed(1)}px) scale(${hs.ws.toFixed(4)})`;  // modüller
  const vm=t>=25.4&&t<30.5;lay($('#mods'),vm,1);if(vm)sceneModules(t);
  // final metinleri
  runText(F1,t,40.0,{st:.04});runText(F2,t,41.0,{st:.035});
  FS.style.opacity=(clamp((t-41.9)*2)).toFixed(2);
  runText(UR,t,42.3,{st:.035});
  const cp=t-42.0;
  lay($('#final'),t>=39,1);
  if(cp<0)cta.style.display='none';else{const bl=t>43.2?.5+.5*Math.sin((t-43.2)*5):0;cta.style.display='flex';const s=Math.max(.001,spring(cp*1.6));cta.style.transform=`scale(${(s*(1+.012*bl)).toFixed(3)})`;cta.style.opacity=clamp(cp*8).toFixed(2);cta.style.boxShadow=`0 20px ${80+30*bl}px rgba(31,139,255,${(.5+.25*bl).toFixed(2)}),0 0 0 2px rgba(255,255,255,.25) inset`}
  // geçişler: karartma (açılış, S1→S2, S3-F→S4, S4→S5, S5→S6)
  let fd=1-prog(t,0,1.4);
  fd=Math.max(fd,tri(t,5.55,6.0,6.5),tri(t,21.35,21.6,22.2),tri(t,29.7,30.0,30.5)*.9,tri(t,38.6,39.0,39.5)*.9);
  $('#fade').style.opacity=clamp(fd).toFixed(3);
  // altyazı (dış ses metni)
  const cue=VO.find(v=>t>=v[0]&&t<v[1]);
  if(cue&&capOn&&!cue[3]){capEl.textContent=cue[2];capEl.style.opacity=(clamp((t-cue[0])*6)*clamp((cue[1]-t)*6)).toFixed(2)}else capEl.style.opacity=0;
  // S5 ekran yazıları
  s5Text(t);
  // film grain 24 fps
  const gf=Math.floor(t*24);if(gf!==lastGrain){lastGrain=gf;$('#grain').style.backgroundPosition=`${(gf*97)%256}px ${(gf*61)%256}px`}
}
const tri=(t,a,b,c)=>t<a||t>c?0:(t<b?(t-a)/(b-a):(c-t)/(c-b));
let lastGrain=-1,sceneSiteTexts=0;
/* S5: dış ses cümleleri ekranda ince tipografiyle */
const S5W=['PERSONELİNİZ.','PROJELERİNİZ.','ARAÇLARINIZ.','TAŞERONLARINIZ.'];
const s5el=document.createElement('div');s5el.className='cin';s5el.style.cssText='left:0;width:1080px;text-align:center;top:260px;font-size:78px;font-weight:300;letter-spacing:.14em;padding-left:.14em;color:#fff';$('#txtl').appendChild(s5el);
const s5b=document.createElement('div');s5b.className='cin';s5b.style.cssText='left:90px;width:900px;text-align:center;top:230px;font-size:62px;font-weight:700;letter-spacing:.02em;text-shadow:0 4px 32px rgba(0,0,0,.85);white-space:normal;line-height:1.2;color:#fff';$('#txtl').appendChild(s5b);
function s5Text(t){
  let a=0,txt='';
  if(t>=32.4&&t<36.2){const k=Math.min(3,Math.floor((t-32.4)/.9));txt=S5W[k];const lt=(t-32.4)-k*.9;a=clamp(lt*6)*(k===3?clamp((36.2-t)*4):clamp((.9-lt)*6))}
  s5el.textContent=txt;s5el.style.opacity=a.toFixed(2);
  const b=t>=36.5&&t<38.9?clamp((t-36.5)*3)*clamp((38.9-t)*4):0;
  s5b.innerHTML='İşinizi yöneten bilgiler,<br><span style="color:#9ff7ee">tek platformda.</span>';s5b.style.opacity=b.toFixed(2);
}

/* =====================================================================
   SES TASARIMI — tarayıcıda üretilen (Web Audio) atmosfer, efekt ve müzik zemini.
   Bu bir dış SES DEĞİLDİR; seslendirme için bkz. DIS-SES.md
   ===================================================================== */
const AU={ctx:null,master:null,nodes:[],on:false,muted:true,noise:null,brown:null,
  init(){
    if(this.ctx)return;const C=new (window.AudioContext||window.webkitAudioContext)();this.ctx=C;
    this.master=C.createGain();this.master.gain.value=this.muted?0:.9;
    const comp=C.createDynamicsCompressor();this.master.connect(comp);comp.connect(C.destination);
    const mk=(brown)=>{const len=C.sampleRate*4,b=C.createBuffer(1,len,C.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b};
    this.noise=mk(false);this.brown=mk(true);
  },
  setMuted(m){this.muted=m;if(this.master)this.master.gain.setTargetAtTime(m?0:.9,this.ctx.currentTime,.05)},
  stop(){this.nodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});this.nodes=[];this.on=false},
  start(t0){
    if(!this.ctx)return;this.stop();const C=this.ctx;if(C.state==='suspended')C.resume();this.on=true;
    const now=C.currentTime+.06,at=t=>now+(t-t0);
    const reg=n=>{this.nodes.push(n);return n};
    // t0'dan itibaren geçerli bir kazanç eğrisi kur
    const env=(gn,pts)=>{let v=pts[0][1];for(let i=0;i<pts.length;i++){if(pts[i][0]<=t0)v=pts[i][1];else{if(i>0&&pts[i-1][0]<t0){const u=(t0-pts[i-1][0])/(pts[i][0]-pts[i-1][0]);v=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*u}break}}
      gn.gain.setValueAtTime(v,now);for(const [t,val] of pts)if(t>t0)gn.gain.linearRampToValueAtTime(val,at(t))};
    const out=(gn)=>{gn.connect(this.master);return gn};
    const noiseSrc=(buf)=>{const s=reg(C.createBufferSource());s.buffer=buf;s.loop=true;s.start(now);return s};
    // 1) rüzgâr
    {const s=noiseSrc(this.noise),f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.6;
     const lfo=reg(C.createOscillator());lfo.frequency.value=.12;const lg2=C.createGain();lg2.gain.value=160;lfo.connect(lg2);lg2.connect(f.frequency);lfo.start(now);
     const gn=C.createGain();s.connect(f);f.connect(gn);out(gn);env(gn,[[0,0],[1.5,.22],[6,.18],[9,.05],[14,.03],[15,0],[29,0],[30,.05],[38,.04],[39,0]])}
    // 2) uzak iş makinesi uğultusu
    {const s=noiseSrc(this.brown),f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=150;const gn=C.createGain();s.connect(f);f.connect(gn);out(gn);
     env(gn,[[0,0],[1,.5],[6,.45],[8,.1],[15,0],[29.9,0],[30.4,.1],[38,.08],[39,0]])}
    // 3) alçak pad (soğuk → gerilim)
    {const gn=C.createGain();out(gn);const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=260;f.connect(gn);
     [[55,'sawtooth',.5],[82.41,'sine',.6],[55.9,'sawtooth',.0]].forEach(([fr,ty,v],i)=>{const o=reg(C.createOscillator());o.type=ty;o.frequency.value=fr;const og=C.createGain();og.gain.value=v;o.connect(og);og.connect(f);o.start(now);
       if(i===2){env(og,[[0,0],[9,0],[15,.55],[21.4,.7],[21.5,0]])}});
     env(gn,[[0,0],[2,.14],[6,.2],[15,.26],[21.4,.28],[21.5,0],[24,0]])}
    // 4) mavi/sıcak pad (MK OPS geldiğinde → çözülme)
    {const gn=C.createGain();out(gn);const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;f.connect(gn);
     [[110,.5],[164.8,.4],[220,.35],[277.2,.25],[329.6,.2]].forEach(([fr,v])=>{const o=reg(C.createOscillator());o.type='sine';o.frequency.value=fr;const og=C.createGain();og.gain.value=v;o.connect(og);og.connect(f);o.start(now)});
     env(gn,[[0,0],[23.9,0],[26,.22],[30,.18],[36,.2],[39,.12],[39.6,.3],[43,.28],[45,0]])}
    // 5) saat tik-takı (S2 → S3)
    for(let s=6;s<21.4;s+=1){if(s<t0)continue;const v=.05+.28*prog(s,6,16);this.click(at(s),v,3200,.018)}
    // 6) telefon titreşimi
    NT.forEach(o=>{if(o.ts>=t0)this.buzz(at(o.ts),.55)});
    // 7) kesme darbeleri (S3)
    [15.0,16.1,17.2,18.3,19.4,20.6].forEach(ts=>{if(ts>=t0){this.whoosh(at(ts),.35);this.hit(at(ts),.5,70,.25)}});
    // 8) karartma + sessizlik sonrası ilk nefes
    if(t0<=24.1)this.hit(at(24.1),.9,52,1.6);
    // 9) modül geçişleri: yumuşak tık
    FOC.forEach(ts=>{if(ts-.5>=t0)this.blip(at(ts-.35),.12,880+(FOC.indexOf(ts))*110)});
    // 10) cümle vurguları
    if(40.0>=t0)this.hit(at(40.0),.7,60,1.2);if(41.0>=t0)this.hit(at(41.0),.5,80,.9);if(42.0>=t0)this.blip(at(42.0),.18,1320);
    if(24.3>=t0)this.blip(at(24.3),.14,1760);
    // 11) S5: hafif klavye/fare tıkları
    for(let s=31;s<38.5;s+=.55+Math.sin(s)*.2){if(s>=t0)this.click(at(s),.14,1800,.012)}
    if(37.0>=t0)this.whoosh(at(37.0),.18);
  },
  click(t,v,fr,d){const C=this.ctx,s=C.createBufferSource();s.buffer=this.noise;const f=C.createBiquadFilter();f.type='highpass';f.frequency.value=fr;const g=C.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random()*2,d+.02);this.nodes.push(s)},
  buzz(t,v){const C=this.ctx;for(let i=0;i<3;i++){const o=C.createOscillator();o.type='square';o.frequency.value=170;const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=C.createGain();const a=t+i*.13;g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(v*.5,a+.01);g.gain.linearRampToValueAtTime(0,a+.09);o.connect(f);f.connect(g);g.connect(this.master);o.start(a);o.stop(a+.12);this.nodes.push(o)}},
  whoosh(t,v){const C=this.ctx,s=C.createBufferSource();s.buffer=this.noise;const f=C.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3600,t+.25);const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.12);g.gain.linearRampToValueAtTime(0,t+.3);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random()*2,.4);this.nodes.push(s)},
  hit(t,v,fr,d){const C=this.ctx,o=C.createOscillator();o.type='sine';o.frequency.setValueAtTime(fr*2,t);o.frequency.exponentialRampToValueAtTime(fr,t+.12);const g=C.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.05);this.nodes.push(o)},
  blip(t,v,fr){const C=this.ctx,o=C.createOscillator();o.type='sine';o.frequency.value=fr;const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.55);this.nodes.push(o)}
};

/* =====================================================================
   OYNATICI, KONTROLLER, TASLAK DIŞ SES (tarayıcı TTS), KENDİ KENDİNİ TEST
   ===================================================================== */
const qs=new URLSearchParams(location.search);
let T=0,playing=true,last=performance.now(),ttsOn=false,lastTT=0;
const stage=$('#stage'),ui=$('#ui');
function fit(){
  const bars=document.body.classList.contains('hideui');
  const th=bars?0:$('#hint').offsetHeight,bh=bars?0:$('#ui').offsetHeight;
  const availH=innerHeight-th-bh;
  const k=qs.get('olcek')==='1'?1:Math.min(innerWidth/W,availH/H);
  stage.style.transform=`scale(${k})`;
  stage.style.left=((innerWidth-W*k)/2)+'px';stage.style.top=(th+(availH-H*k)/2)+'px';
}
addEventListener('resize',fit);
new MutationObserver(fit).observe(document.body,{attributes:true,attributeFilter:['class']});
if(window.ResizeObserver){new ResizeObserver(fit).observe($('#ui'));new ResizeObserver(fit).observe($('#hint'))}
let lastTap=0;stage.addEventListener('pointerup',()=>{const n=Date.now();if(n-lastTap<350){document.body.classList.remove('rec');document.body.classList.toggle('hideui')}lastTap=n});
document.addEventListener('fullscreenchange',()=>{if(!document.body.classList.contains('rec'))document.body.classList.toggle('hideui',!!document.fullscreenElement)});
fit();
// sahne zaman çizelgesi
const scn=$('#scn');SC.forEach((s,i)=>{const e=document.createElement('i');e.style.width=((s.b-s.a)/DUR*100)+'%';e.textContent=s.n;e.title=s.a+'–'+s.b+' sn';e.onclick=()=>seekTo(s.a);scn.appendChild(e)});
function upd(){$('#tm').textContent=T.toFixed(1)+' / '+DUR.toFixed(1)+' sn';$('#seek').value=T;$('#bPlay').textContent=playing?'⏸ Duraklat':'▶ Oynat';
  [...scn.children].forEach((e,i)=>e.classList.toggle('cur',T>=SC[i].a&&T<SC[i].b))}
function audioSync(){if(!AU.ctx)return;if(playing&&!AU.muted)AU.start(T);else AU.stop()}
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=.92;u.pitch=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function setPlay(p){playing=p;if(p&&T>=DUR)T=0;if(!p)try{speechSynthesis.cancel()}catch(e){}audioSync();upd()}
function seekTo(t){T=clamp(t,0,DUR);try{speechSynthesis.cancel()}catch(e){}audioSync();upd();render(T)}
function restart(){T=0;playing=true;audioSync();upd()}
function setSound(on){if(on){AU.init();AU.setMuted(false);$('#bSnd').textContent='🔊 Ses açık';$('#bSnd').classList.add('on');audioSync()}else{AU.setMuted(true);AU.stop();$('#bSnd').textContent='🔇 Ses kapalı';$('#bSnd').classList.remove('on')}}
function recMode(on){document.body.classList.toggle('rec',on);document.body.classList.toggle('hideui',on);if(on&&!qs.has('altyazi')){capOn=false}}
function startRecording(){recMode(true);T=0;playing=false;try{speechSynthesis.cancel()}catch(e){}AU.stop();setTimeout(()=>{playing=true;last=performance.now();audioSync()},3000)}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){const p=T;T+=dt;if(T>=DUR){T=DUR;playing=false;AU.stop()}
    if(ttsOn)for(const v of VO){if(p<v[0]&&T>=v[0])speak(v[2])}}
  render(T);
  if(!document.body.classList.contains('hideui'))upd();
  requestAnimationFrame(loop);
}
$('#bPlay').onclick=()=>setPlay(!playing);
$('#bRestart').onclick=restart;
$('#bSnd').onclick=()=>setSound(AU.muted);
$('#bCap').onclick=()=>{capOn=!capOn;$('#bCap').classList.toggle('on',capOn)};
$('#bTts').onclick=()=>{ttsOn=!ttsOn;$('#bTts').classList.toggle('on',ttsOn);if(!ttsOn)try{speechSynthesis.cancel()}catch(e){}};
$('#bHide').onclick=()=>document.body.classList.add('hideui');
$('#bRec').onclick=startRecording;
$('#bFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
$('#seek').oninput=e=>{playing=false;seekTo(parseFloat(e.target.value))};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
  else if(e.key==='r'||e.key==='R')restart();
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('hideui');
  else if(e.key==='k'||e.key==='K')startRecording();
  else if(e.key==='f'||e.key==='F')$('#bFs').onclick();
  else if(e.key==='m'||e.key==='M')setSound(AU.muted);
  else if(e.key==='c'||e.key==='C')$('#bCap').onclick();
  else if(e.key==='ArrowRight')seekTo(T+2);else if(e.key==='ArrowLeft')seekTo(T-2);
  else if(e.key==='Escape')document.body.classList.remove('hideui','rec');
});
// ilk kullanıcı etkileşiminde ses motorunu hazırla (tarayıcı otomatik ses çalmaya izin vermez)

if(qs.has('pre'))qs.get('pre').split(',').forEach(x=>render(parseFloat(x)));
if(qs.has('t')){T=parseFloat(qs.get('t'))||0;playing=false}
if(qs.get('arayuz')==='0'){document.body.classList.add('hideui');ui.style.display='none';$('#hint').style.display='none'}
if(qs.has('altyazi'))capOn=qs.get('altyazi')!=='0';
if(qs.get('kayit')==='1'){recMode(true);T=0;playing=false;const d=parseFloat(qs.get('gecikme')||'3');setTimeout(()=>{playing=true;last=performance.now()},d*1000)}

/* ---------- kendi kendini test: ?selftest=1 ----------
   Tüm zaman çizelgesini 0.25 sn adımlarla gezer; hata yakalar, metinlerin güvenli alanda olup olmadığını ölçer. */
function selftest(){
  const out={dur:DUR,scenes:SC.map(s=>`${s.a}-${s.b} ${s.n}`),sceneSum:SC.reduce((a,s)=>a+(s.b-s.a),0),continuous:SC.every((s,i)=>i===0||s.a===SC[i-1].b)&&SC[0].a===0&&SC[SC.length-1].b===DUR,errors:[],overflow:[]};
  const sels=['.ch','.cin','#cap','.pill','.pn','.pnl','.ln'];
  for(let t=0;t<=DUR;t+=.25){
    try{render(t)}catch(e){out.errors.push(t+': '+e.message)}
    document.querySelectorAll('.ch').forEach(el=>{
      const cs=getComputedStyle(el);if(cs.visibility==='hidden'||+cs.opacity<.5)return;
      let p=el.parentElement,vis=true;while(p&&p.id!=='stage'){const s=getComputedStyle(p);if(s.visibility==='hidden'||s.display==='none'||+s.opacity<.4){vis=false;break}p=p.parentElement}
      if(!vis)return;const r=el.getBoundingClientRect();if(!r.width)return;
      if(r.left<-2||r.right>W+2)out.overflow.push(`${t}: "${el.textContent}" x=${Math.round(r.left)}..${Math.round(r.right)}`)});
  }
  out.overflow=[...new Set(out.overflow)].slice(0,30);
  try{AU.init();AU.setMuted(true);AU.start(0);AU.start(24);AU.start(40);AU.stop();out.audioSmoke='ok'}catch(e){out.errors.push('audio: '+e.message)}
  render(DUR);
  out.finalFrame={ctaVisible:getComputedStyle($('#cta')).display!=='none',urlChars:UR.chars.filter(c=>!c.sp).length,urlText:UR.chars.map(c=>c.el.textContent||' ').join('')};
  $('#st').textContent=JSON.stringify(out,null,1);document.title='SELFTEST-DONE';
}
if(qs.get('selftest')==='1'){document.body.classList.add('hideui');setTimeout(selftest,300)}
else requestAnimationFrame(n=>{last=n;loop(n)});
</script>
