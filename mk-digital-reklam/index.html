<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MK DIGITAL SYSTEMS — Reklam Filmi (9:16)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="viewport">
    <div id="stage-fit">
      <div id="stage">
        <div id="grade"></div>
        <canvas id="fx" width="1080" height="1920"></canvas>
        <div id="scenes"></div>
        <div id="vignette"></div>
        <div id="grain"></div>
        <div id="fade"></div>
        <div id="safe"></div>
      </div>
    </div>
    <button id="bigplay">▶ Oynat</button>
    <div id="warn"></div>
  </main>

  <footer id="controls">
    <div id="tl"><div id="segs"></div><input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Zaman çizelgesi"></div>
    <div class="row">
      <button id="restart" title="Yeniden başlat">⏮ Baştan</button>
      <button id="play" title="Oynat / duraklat">▶ Oynat</button>
      <span id="time">0:00.0</span>
      <button id="mute" title="Ses aç / kapat">🔊 Ses</button>
      <button id="full" title="Tam ekran">⛶ Tam ekran</button>
    </div>
    <div class="row" id="scenebtns"></div>
    <details><summary>Daha fazla</summary><div class="row">
      <button id="safebtn" title="TikTok/Instagram güvenli alan kılavuzu">▭ Güvenli alan</button>
      <button id="rec" title="Sekmeyi kaydedip WebM indirir (deneysel)">⏺ Tarayıcıda kaydet (WebM)</button>
      <button id="wav" title="Müziği WAV olarak indirir">⬇ Müzik (WAV)</button>
    </div></details>
    <div id="msg"></div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
