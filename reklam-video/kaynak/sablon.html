<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MK OPS — Animasyonlu Reklam (9:16 · 25 sn)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Inter","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.rec{cursor:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#04070f}
#stage>*{position:absolute;left:0;top:0}
canvas#fx{width:1080px;height:1920px}
.scene{width:1080px;height:1920px;will-change:opacity,transform;visibility:hidden}
#vig{width:1080px;height:1920px;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 66%,rgba(0,0,0,.3) 100%)}
#grain{width:1080px;height:1920px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:256px 256px}

/* ---- kinetik yazı ---- */
.txt{position:absolute;left:0;width:1080px;text-align:center;pointer-events:none}
.ln{white-space:nowrap;font-weight:900;color:#f2f7ff;letter-spacing:-.012em;line-height:1.02;font-family:"Inter","Segoe UI Black","Segoe UI Variable Display","Segoe UI",Arial,sans-serif}
.ln .in{display:inline-block}
.ch{display:inline-block;transform-origin:50% 88%;will-change:transform,opacity;text-shadow:0 8px 34px rgba(0,0,0,.55)}
.sp{width:.27em}
.k1{color:#19e3d0;text-shadow:0 0 38px rgba(25,227,208,.55),0 8px 30px rgba(0,0,0,.5)}
.k2{color:#ff6b4a;text-shadow:0 0 34px rgba(255,90,60,.42),0 8px 30px rgba(0,0,0,.5)}
.k3{color:#4aa3ff;text-shadow:0 0 36px rgba(31,139,255,.55),0 8px 30px rgba(0,0,0,.5)}
.sm .ln{font-weight:800}

/* ---- sahne 1 kaos ---- */
.it{position:absolute;left:0;top:0;will-change:transform,opacity;display:none}
.bub{width:max-content;max-width:560px;padding:20px 26px 16px;border-radius:26px 26px 26px 6px;background:#10261f;border:1px solid rgba(120,255,190,.15);color:#d9f7e8;font-size:34px;font-weight:600;line-height:1.25;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.bub b{display:block;font-size:24px;font-weight:800;margin-bottom:6px;color:#5ee6a3}
.bub i{display:block;text-align:right;font-style:normal;font-size:20px;opacity:.55;margin-top:6px}
.sheet{width:440px;border-radius:14px;background:#0e1a15;border:1px solid rgba(80,220,140,.25);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet .sh{background:#1a6b40;color:#e6fff0;font-size:23px;font-weight:700;padding:12px 18px;white-space:nowrap}
.sheet .cells{position:relative;height:240px;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:55px 30px}
.sheet .cells u{position:absolute;width:55px;height:30px;background:rgba(255,80,60,.55)}
.sheet .cells s{position:absolute;width:110px;height:30px;background:rgba(255,200,60,.35)}
.note{width:300px;padding:26px 24px;background:#e9dfb5;color:#4a3d1c;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:36px;font-weight:700;line-height:1.2;box-shadow:0 20px 50px rgba(0,0,0,.5);white-space:pre}
#badge{left:880px;top:120px;width:150px;height:150px;margin:0;border-radius:50%;background:#ff3b30;color:#fff;font-weight:900;font-size:62px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(255,59,48,.22),0 20px 60px rgba(255,59,48,.5)}
#badgeL{left:800px;top:290px;width:310px;text-align:center;color:#ffb3ab;font-size:28px;font-weight:700;letter-spacing:.04em;display:none}
#scrim1{width:1080px;height:1920px;background:radial-gradient(ellipse 75% 24% at 50% 49%,rgba(3,6,14,.92),rgba(3,6,14,0) 100%)}

/* ---- HUD ---- */
#hud{width:1080px;height:1920px;pointer-events:none}
#tile{position:absolute;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:22%;overflow:hidden;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 90px rgba(31,139,255,.65),0 30px 80px rgba(0,0,0,.5);opacity:0;will-change:transform,opacity}
#tile img{width:106%;height:106%;margin:-3%;display:block}

/* ---- ikinci bölüm: gerçek ekranlar ---- */
#s4>*,#s5>*{position:absolute;left:0;top:0}
.win{border-radius:22px;background:#f6f8fb;overflow:hidden;box-shadow:0 50px 110px rgba(0,0,0,.65),0 0 90px rgba(31,139,255,.30),0 0 0 1px rgba(255,255,255,.35);will-change:transform,opacity,filter;transform-origin:50% 50%}
.win .bar{position:relative;height:44px;background:#edf1f7;border-bottom:1px solid #d9e1ec}
.win .bar i{position:absolute;top:15px;width:14px;height:14px;border-radius:50%}
.win .bar span{position:absolute;left:104px;top:7px;height:30px;line-height:30px;padding:0 18px;border-radius:15px;background:#fff;color:#51607a;font-size:18px;font-weight:700}
.win img{display:block;width:100%}
.win .gl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 62%);transform:translateX(-130%)}
.pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:9px 26px 9px 10px;border-radius:40px;background:#fff;color:#0a1630;font-size:34px;font-weight:800;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 3px rgba(31,139,255,.25);will-change:transform,opacity;opacity:0}
.pill b{width:42px;height:42px;border-radius:50%;background:#0b6bd6;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
#chips{left:0;top:1420px;width:1080px;display:flex;justify-content:center;gap:12px}
.chip{position:relative;padding:13px 22px;border-radius:40px;background:rgba(14,34,74,.85);border:2px solid rgba(90,170,255,.45);color:#eaf4ff;font-size:31px;font-weight:800;white-space:nowrap;opacity:0;will-change:transform}
#cta{left:100px;top:1320px;width:880px;height:120px;border-radius:60px;background:linear-gradient(100deg,#0b6bd6,#1f8bff 55%,#19e3d0);color:#fff;font-size:46px;font-weight:900;letter-spacing:.01em;display:none;align-items:center;justify-content:center;gap:20px;box-shadow:0 20px 80px rgba(31,139,255,.6),0 0 0 2px rgba(255,255,255,.25) inset;overflow:hidden;white-space:nowrap}
#cta em{font-style:normal;font-size:52px}
#cta .sh{position:absolute;top:0;left:-30%;width:25%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg)}

/* ---- kontroller ---- */
#ui{position:fixed;left:0;bottom:0;width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:10px 12px;background:#05080f;border-top:1px solid rgba(90,170,255,.25);z-index:10}
#ui button{all:unset;cursor:pointer;color:#e8f1ff;font:700 14px/1 "Segoe UI",Arial,sans-serif;padding:10px 14px;border-radius:10px;background:rgba(90,170,255,.16);white-space:nowrap}
#ui button:hover{background:rgba(90,170,255,.34)}
#ui input{width:min(34vw,260px);accent-color:#19e3d0}
#ui span{color:#9fc4ff;font:700 13px "Segoe UI",Arial,sans-serif;min-width:78px;text-align:center}
body.hideui #ui,body.hideui #hint{display:none}
@media (max-width:700px){#hint{display:none}#ui{gap:6px;padding:6px 8px;flex-wrap:nowrap}#ui button{font-size:13px;padding:9px 10px}#ui #seek,#ui #tm,#ui #scn,#ui #bHide,#ui #bCap,#ui #bTts{display:none}}
#hint{position:fixed;left:0;top:0;width:100%;padding:8px 12px;text-align:center;background:#05080f;border-bottom:1px solid rgba(90,170,255,.2);color:#7fa3d6;font:600 12px "Segoe UI",Arial,sans-serif;z-index:10}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>

  <div id="s1" class="scene">
    <div id="chaos"></div>
    <div id="scrim1"></div>
    <div id="badge">0</div><div id="badgeL">OKUNMAMIŞ MESAJ</div>
  </div>
  <div id="s2" class="scene"></div>
  <div id="s3" class="scene"></div>
  <div id="s4" class="scene"></div>
  <div id="s5" class="scene">
    <div id="chips"></div>
    <div id="cta"><span>48 SAAT ÜCRETSİZ DENEYİN</span><em>→</em><div class="sh"></div></div>
  </div>

    <div id="tile"><img alt="MK OPS" src="{{LOGO}}"></div>

<div id="hint">Boşluk: oynat/duraklat · R: yeniden başlat · H: kontrolleri gizle · K: kayıt modu · F: tam ekran</div>
<div id="ui">
  <button id="bPlay">⏸ Duraklat</button>
  <button id="bRestart">↺ Yeniden</button>
  <input id="seek" type="range" min="0" max="25" step="0.01" value="0">
  <span id="tm">0.0 / 25.0 sn</span>

  <button id="bRec">● Kayıt modu (K)</button>
  <button id="bFs">⛶</button>
</div>

<script>
"use strict";
/* ============================================================
   MK OPS — 25 sn reklam. Tüm animasyon tek bir zaman değeri (t)
   üzerinden hesaplanır; oynat/duraklat/sar hepsi aynı çizimi verir.
   ============================================================ */
const W=1080,H=1920,DUR=25;
const FONT='"Inter","Segoe UI Variable Display","Segoe UI",Arial,sans-serif';
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;
const eOut=u=>1-Math.pow(1-u,3), eIn=u=>u*u*u;
const eIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eExp=u=>u>=1?1:1-Math.pow(2,-10*u);
const sm=u=>u*u*(3-2*u);
const spring=p=>p<=0?0:1-Math.exp(-6.5*p)*Math.cos(15*p);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20251);
const mixc=(a,b,u)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],u))).join(',')})`;

/* ---------------- kinetik yazı motoru ---------------- */
function buildText(host,spec){
  const el=document.createElement('div');el.className='txt'+(spec.cls?' '+spec.cls:'');
  el.style.top=(spec.top||0)+'px';host.appendChild(el);
  const chars=[];let k=0;const ins=[];
  spec.lines.forEach((ln,li)=>{
    const d=document.createElement('div');d.className='ln';d.style.fontSize='100px';
    const inn=document.createElement('span');inn.className='in';d.appendChild(inn);el.appendChild(d);ins.push(inn);
    ln.segs.forEach(([txt,cls])=>{for(const ch of txt){
      const s=document.createElement('span');s.className='ch'+(cls?' '+cls:'');
      if(ch===' '){s.className+=' sp'}else{s.textContent=ch}
      inn.appendChild(s);chars.push({el:s,li,k:k++,sp:ch===' ',r:R(),c:''});
    }});
  });
  spec.lines.forEach((ln,li)=>{
    const d=el.children[li];const w=ins[li].offsetWidth||1;
    const fs=Math.min(ln.max||200,100*(spec.maxW||940)/w);
    d.style.fontSize=fs.toFixed(1)+'px';ln._fs=fs;ln._w=w*fs/100;
    if(ln.lh)d.style.lineHeight=ln.lh;
  });
  return {el,chars,spec,n:k,ins};
}
function runText(tx,t,t0,o){
  o=o||{};const st=o.st==null?.04:o.st,ex=o.ex,exSt=o.exSt==null?.01:o.exSt,exMode=o.exMode||'fall';
  const endT=ex==null?1e9:ex+tx.n*exSt+.9;
  if(t<t0||t>endT){tx.el.style.display='none';return false}
  tx.el.style.display='block';
  for(const c of tx.chars){
    if(c.sp)continue;
    const ln=tx.spec.lines[c.li];const mode=ln.mode||'drop';
    const p=t-(t0+c.k*st);
    let y=0,sx=1,sy=1,rot=0,op=0,bl=0,sc=1;
    if(p>0){
      op=1;
      if(mode==='drop'){
        const fd=.34+c.r*.1;
        if(p<fd){const u=p/fd;y=-(1-u*u)*(1500+c.r*300);sy=1.28;sx=.84;rot=(c.r-.5)*10*(1-u);bl=(1-u)*3}
        else{const q=p-fd;const e=Math.exp(-8*q)*Math.cos(22*q);sy=1-.4*e;sx=1+.24*e;y=-Math.abs(Math.sin(q*13))*Math.exp(-6*q)*34}
      }else if(mode==='grow'){
        sc=spring(p);op=clamp(p*9);bl=(1-clamp(p*5))*10;
      }else if(mode==='shrink'){
        sc=1+2.6*Math.exp(-8.5*p)*Math.cos(8*p);op=clamp(p*12);bl=13*Math.exp(-13*p);
      }else{ y=(1-eOut(clamp(p/.5)))*70;op=clamp(p*4);bl=(1-clamp(p*3))*8 }
    }
    if(ex!=null){
      const q=t-(ex+c.k*exSt);
      if(q>0){
        if(exMode==='fall'){y+=q*q*2900;sy*=1+q*1.1;rot+=(c.r-.5)*34*q;op*=1-clamp(q/.4)}
        else{const u=clamp(q/.42);sc*=1-eIn(u);op*=1-u}
      }
    }
    const s=`translate3d(0,${y.toFixed(1)}px,0) rotate(${rot.toFixed(1)}deg) scale(${(sx*sc).toFixed(3)},${(sy*sc).toFixed(3)})`;
    const key=s+'|'+op.toFixed(2)+'|'+(bl>.4?bl.toFixed(1):0);
    if(c.c!==key){c.c=key;const e=c.el.style;e.transform=s;e.opacity=op.toFixed(3);e.filter=bl>.4?`blur(${bl.toFixed(1)}px)`:'none'}
  }
  return true;
}
const L=(text,cls)=>[[text,cls||'']];

/* ---------------- sahne 1: kaos ---------------- */
const chaos=[];
(function(){
  const host=$('#chaos');
  const chat=['Abi bugünkü puantajı atar mısın?','Hakediş son hali hangisiydi?','Araç şu an hangi şantiyede?','Depoda kaç boru kaldı?','Kim gelmedi bugün?','Metrajı tekrar gönderir misin?','Excel yine açılmıyor...','Fotoğrafları grupta bulamıyorum','Fatura hangi dosyadaydı?','Yarın hangi ekip nerede?','Bu liste güncel mi?','Son hali hangisi?'];
  const names=['Şantiye Şefi','Muhasebe','Usta Mehmet','Depocu','Müteahhit'];
  const files=['puantaj_NİSAN_son_v3.xlsx','hakediş_FİNAL_gerçek.xlsx','stok_listesi (1).xlsx','araç_takip_eski.xlsx','metraj_düzeltilmiş2.xlsx'];
  const notes=['hakediş\nmetraj ???','yarın:\n3 ekip kim?','boru stok\nsay!!','araç\nsigorta ?'];
  const N=14,types=[];
  for(let i=0;i<N;i++)types.push(i%5<3?'b':(i%5===3?'s':'n'));
  for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));[types[i],types[j]]=[types[j],types[i]]}
  let bi=0,si=0,ni=0;
  types.forEach((ty,i)=>{
    const el=document.createElement('div');el.className='it';
    if(ty==='b'){el.className+=' bub';el.innerHTML=`<b>${names[bi%5]}</b>${chat[bi%chat.length]}<i>${14+(bi%9)}:${10+bi*3%49} ✓✓</i>`;bi++}
    else if(ty==='s'){el.className+=' sheet';let cells='';for(let k=0;k<5;k++){cells+=k%2?`<u style="left:${Math.floor(R()*7)*55}px;top:${Math.floor(R()*8)*30}px"></u>`:`<s style="left:${Math.floor(R()*6)*55}px;top:${Math.floor(R()*8)*30}px"></s>`}
      el.innerHTML=`<div class="sh">${files[si%5]}</div><div class="cells">${cells}</div>`;si++}
    else{el.className+=' note';el.textContent=notes[ni%4];ni++}
    host.appendChild(el);
    const mid=Math.abs(0)||0;
    let y=90+R()*1740;
    const inMid=y>650&&y<1250;
    chaos.push({el,ts:.12+i*(2.85/N)+R()*.06,x:(ty==='b'?270+R()*520:230+R()*620),y,rot:(R()-.5)*26,vr:(R()-.5)*3,vx:(R()-.5)*22,vy:(R()-.5)*18,sc:.72+R()*.3,op:(inMid?.2:.8),ph:R()*6,fr:R(),w:ty==='b'?420:(ty==='s'?440:300)});
  });
})();
const H1=buildText($('#s1'),{top:690,lines:[
  {segs:L('ŞANTİYENİZİ HÂLÂ'),max:96,mode:'drop'},
  {segs:L('EXCEL VE','k2'),max:190,mode:'shrink'},
  {segs:L('WHATSAPP İLE Mİ','k2'),max:124,mode:'grow'},
  {segs:L('YÖNETİYORSUNUZ?'),max:130,mode:'drop'}]});
const badge=$('#badge'),badgeL=$('#badgeL');

/* ---------------- sahne 2: sorun ---------------- */
const P=[
 buildText($('#s2'),{top:930,lines:[{segs:L('DAĞINIK','k2'),max:96,mode:'drop'},{segs:L('PUANTAJ KAYITLARI'),max:66,mode:'drop',lh:1.0}]}),
 buildText($('#s2'),{top:1135,lines:[{segs:L('TAKİBİ ZOR','k2'),max:96,mode:'shrink'},{segs:L('PERSONEL VE ARAÇLAR'),max:66,mode:'drop',lh:1.0}]}),
 buildText($('#s2'),{top:1340,lines:[{segs:L('KARMAŞIK','k2'),max:96,mode:'grow'},{segs:L('HAKEDİŞ SÜREÇLERİ'),max:66,mode:'drop',lh:1.0}]})];
const PT=[3.85,4.7,5.55];
const SOL=buildText($('#s2'),{top:870,lines:[
  {segs:L('ARTIK'),max:140,mode:'drop'},
  {segs:[['DAHA ',''],['KOLAY','k1']],max:170,mode:'shrink'},
  {segs:L('BİR YOL VAR.'),max:130,mode:'grow'}]});

/* ---------------- sahne 3: logo ---------------- */
const WM=buildText($('#hud'),{top:0,maxW:780,lines:[{segs:L('MK OPS'),max:260,mode:'grow',lh:1}]});
WM.el.style.transformOrigin='540px 50%';
const WMF=WM.spec.lines[0]._fs,WMW=WM.spec.lines[0]._w;
const SUB=buildText($('#s3'),{top:1120,lines:[
  {segs:L('ŞANTİYE VE OPERASYON'),max:62,mode:'drop',lh:1.1},
  {segs:L('YÖNETİM PLATFORMU','k1'),max:62,mode:'drop',lh:1.1}]});
const tile=$('#tile');
function hudState(t){
  const A={tx:540,ty:700,ts:1,wx:540,wy:1010,ws:1};
  const Hd={tx:112,ty:100,ts:.34,wx:182+WMW*(64/WMF)/2,wy:104,ws:64/WMF};
  const C={tx:540,ty:640,ts:.9,wx:540,wy:935,ws:1};
  const u1=eIO(prog(t,12.1,12.9)),u2=eIO(prog(t,21.9,22.6));
  const o={};
  for(const k in A){o[k]=lerp(lerp(A[k],Hd[k],u1),C[k],u2)}
  return o;
}

/* ---------------- ikinci bölüm: gerçek ekranlar + çizgili açıklamalar ---------------- */
const SRC={dash:'{{DASH}}',proje:'{{PROJE}}',puantaj:'{{PUANTAJ}}'};
function mkWin(host,src,w,h){
  const el=document.createElement('div');el.className='win';el.style.width=w+'px';if(h)el.style.height=h+'px';
  el.innerHTML='<div class="bar"><i style="left:20px;background:#ff5f57"></i><i style="left:44px;background:#febc2e"></i><i style="left:68px;background:#28c840"></i><span>mk-ops.tr/panel</span></div>';
  const im=new Image();im.src=src;im.draggable=false;el.appendChild(im);
  const gl=document.createElement('div');gl.className='gl';el.appendChild(gl);
  host.appendChild(el);return {el,gl};
}
// pencereyi kameraya "odak çekerek" sokar: yönden gelir, bulanıktan netleşir
function winPose(wn,x,y,from,u,exit){
  const dx=from==='r'?1000:from==='l'?-1000:0,dy=from==='b'?900:(from==='t'?-500:0);
  const ry=from==='r'?-26:from==='l'?26:0,rx=from==='b'?22:0;
  const e=exit||0,k=1-u;
  const el=wn.el;
  el.style.opacity=(clamp(u*2.2)*(1-e)).toFixed(3);
  el.style.transform=`perspective(1700px) translate3d(${(x+dx*k).toFixed(1)}px,${(y+dy*k-e*150).toFixed(1)}px,0) rotateX(${(rx*k).toFixed(2)}deg) rotateY(${(ry*k).toFixed(2)}deg) scale(${(1-.05*e).toFixed(4)})`;
  const bl=k*12+e*8;el.style.filter=bl>.3?`blur(${bl.toFixed(1)}px)`:'none';
}
const NS='http://www.w3.org/2000/svg';
const co=document.createElementNS(NS,'svg');co.setAttribute('width',W);co.setAttribute('height',H);co.style.cssText='position:absolute;left:0;top:0;overflow:visible;pointer-events:none';
function svg(tag,at,st){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(st)e.style.cssText=st;co.appendChild(e);return e}

      c.style.opacity=(clamp(s*3)*(1-hx)).toFixed(2);c.style.transform=`scale(${(Math.max(s,.001)*(1+.15*b)).toFixed(3)})`;
      c.style.background=`rgba(${Math.round(lerp(14,25,b))},${Math.round(lerp(34,150,b))},${Math.round(lerp(74,190,b))},.85)`;
      c.style.borderColor=b>.05?`rgba(25,227,208,${(.45+.5*b).toFixed(2)})`:'rgba(90,170,255,.45)';
    });
    runText(SUBE,t,22.3,{st:.022});
    runText(UR,t,22.5,{st:.035});
    const cp=t-22.45;
    if(cp<0)cta.style.display='none';else{
      const bl=t>23.0?.5+.5*Math.sin((t-23.0)*6.5):0;
      cta.style.display='flex';const s=Math.max(.001,spring(cp*1.6));cta.style.transform=`scale(${(s*(1+.02*bl)).toFixed(3)})`;cta.style.opacity=clamp(cp*8).toFixed(2);
      cta.style.filter=`brightness(${(1+.22*bl).toFixed(3)})`;
      cta.style.boxShadow=`0 20px ${80+40*bl}px rgba(31,139,255,${(.5+.35*bl).toFixed(2)}),0 0 0 2px rgba(255,255,255,.25) inset`;
      ctaSh.style.left=lerp(-30,115,prog(t,22.8,23.2))+'%';
    }
  }  // film grenini 24 fps ile oynat
  const gf=Math.floor(t*24);if(gf!==lastGrain){lastGrain=gf;$('#grain').style.backgroundPosition=`${(gf*97)%256}px ${(gf*61)%256}px`}
}

/* ---------------- oynatıcı ve kontroller ---------------- */
const qs=new URLSearchParams(location.search);
let T=0,playing=true,last=performance.now(),delay=0;
const stage=$('#stage'),ui=$('#ui');
function fit(){
  const bars=document.body.classList.contains('hideui');
  const th=bars?0:$('#hint').offsetHeight,bh=bars?0:$('#ui').offsetHeight;
  const availH=innerHeight-th-bh;
  const k=qs.get('olcek')==='1'?1:Math.min(innerWidth/W,availH/H);
  stage.style.transform=`scale(${k})`;
  stage.style.left=((innerWidth-W*k)/2)+'px';stage.style.top=(th+(availH-H*k)/2)+'px';
}
addEventListener('resize',fit);
new MutationObserver(fit).observe(document.body,{attributes:true,attributeFilter:['class']});
if(window.ResizeObserver){new ResizeObserver(fit).observe($('#ui'));new ResizeObserver(fit).observe($('#hint'))}
let lastTap=0;stage.addEventListener('pointerup',()=>{const n=Date.now();if(n-lastTap<350){document.body.classList.remove('rec');document.body.classList.toggle('hideui')}lastTap=n});
document.addEventListener('fullscreenchange',()=>{if(!document.body.classList.contains('rec'))document.body.classList.toggle('hideui',!!document.fullscreenElement)});
fit();
function upd(){$('#tm').textContent=T.toFixed(1)+' / '+DUR.toFixed(1)+' sn';$('#seek').value=T;$('#bPlay').textContent=playing?'⏸ Duraklat':'▶ Oynat'}
function setPlay(p){playing=p;if(p&&T>=DUR)T=0;upd()}
function restart(){T=0;playing=true;upd()}
function recMode(on){document.body.classList.toggle('rec',on);document.body.classList.toggle('hideui',on)}
function startRecording(){recMode(true);T=0;playing=false;delay=3;upd();setTimeout(()=>{playing=true},3000)}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){T+=dt;if(T>=DUR){T=DUR;playing=false}}
  render(T);
  if(!document.body.classList.contains('hideui'))upd();
  requestAnimationFrame(loop);
}
$('#bPlay').onclick=()=>setPlay(!playing);
$('#bRestart').onclick=restart;
$('#bHide').onclick=()=>document.body.classList.add('hideui');
$('#bRec').onclick=startRecording;
$('#bFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
$('#seek').oninput=e=>{T=parseFloat(e.target.value);playing=false;upd()};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
  else if(e.key==='r'||e.key==='R')restart();
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('hideui');
  else if(e.key==='k'||e.key==='K')startRecording();
  else if(e.key==='f'||e.key==='F')$('#bFs').onclick();
  else if(e.key==='ArrowRight'){T=Math.min(DUR,T+1)}
  else if(e.key==='ArrowLeft'){T=Math.max(0,T-1)}
  else if(e.key==='Escape')document.body.classList.remove('hideui','rec');
});

if(qs.has('t')){T=parseFloat(qs.get('t'))||0;playing=false}
if(qs.get('kayit')==='1'){recMode(true);const d=parseFloat(qs.get('gecikme')||'3');T=0;playing=false;setTimeout(()=>{playing=true;last=performance.now()},d*1000)}
if(qs.get('arayuz')==='0')document.body.classList.add('hideui');
requestAnimationFrame(n=>{last=n;loop(n)});
</script>
